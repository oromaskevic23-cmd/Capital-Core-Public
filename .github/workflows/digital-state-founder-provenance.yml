name: IMPERIAL Core — Digital State & Founder Provenance Guard
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  digital-state-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Syntax and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools/verify_founder_provenance.py tests/test_founder_provenance.py
          python -m unittest discover -s tests -p 'test_founder_provenance.py' -v
      - name: Validate license and project attribution anchors
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_founder_provenance.py --root .
      - name: Validate newly added IMPERIAL original source without relicensing others
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          from tools.verify_founder_provenance import verify_repository
          base=os.environ.get("BASE_SHA","")
          added=[]
          if len(base)==40 and base.strip("0"):
              subprocess.run(["git","cat-file","-e",base+"^{commit}"],check=True)
              result=subprocess.run(["git","diff","--diff-filter=A","--name-only",
                  base+"...HEAD"],check=True,capture_output=True,text=True)
              added=[p for p in result.stdout.splitlines() if p]
          report=verify_repository(Path("."),added)
          print("FOUNDER_RIGHTS_PROVENANCE_PASS",len(report["checked_paths"]),
                "new_original_code_checked",sum(p.startswith("imperial_core/") for p in added),
                "proof_of_ownership",report["proof_of_legal_ownership"])
          PY
