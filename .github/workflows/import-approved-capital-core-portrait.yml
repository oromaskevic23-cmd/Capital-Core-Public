name: Import approved Capital Core portrait
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-capital-core-portrait.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-portrait:
    if: github.repository == 'oromaskevic23-cmd/Capital-Core-Public'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and independently verify the exact owner-provided image
        env:
          APPROVED_IMAGE_URL: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IVOKXTwsRFSR1qLtI96nF4edlB/628727f0-ad54-4971-af94-ef8b942b7989.jpg'
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3 "$APPROVED_IMAGE_URL" -o "$RUNNER_TEMP/approved-portrait.jpg"
          printf '%s  %s\n' '6e9929901877d81cb60105b9497d8573538a1621c677c775d82025014df59d4c' "$RUNNER_TEMP/approved-portrait.jpg" | sha256sum --check
          mkdir -p assets
          cp "$RUNNER_TEMP/approved-portrait.jpg" 'assets/sophia-bennett-frankfurt-commercial-properties.jpg'
          python3 - <<'PY'
          from pathlib import Path
          f=Path('README.md')
          s=f.read_text(encoding='utf-8')
          public_url='https://d2ol7oe51mr4n9.cloudfront.net/user_3IVOKXTwsRFSR1qLtI96nF4edlB/628727f0-ad54-4971-af94-ef8b942b7989.jpg'
          local_path='assets/sophia-bennett-frankfurt-commercial-properties.jpg'
          if public_url not in s and local_path not in s:
              raise SystemExit('README has changed unexpectedly; refusing to edit')
          f.write_text(s.replace(public_url,local_path), encoding='utf-8')
          PY
      - name: Commit verified image into the public repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md 'assets/sophia-bennett-frankfurt-commercial-properties.jpg'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Already synchronized'
            exit 0
          fi
          git commit -m 'assets(capital-core): import verified Sophia Bennett Frankfurt banner'
          git push
